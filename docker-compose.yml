# Earn With Ali Bhai — course platform (production compose)
services:
  web:
    build: .
    container_name: eabh-course-platform
    restart: unless-stopped
    env_file:
      - .env            # production env (copy from .env.example, fill real values)
    environment:
      PORT: 3000
      NODE_ENV: production
      TRUST_PROXY: 1
      COOKIE_SECURE: 1
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Publish directly (TLS via Cloudflare Tunnel or VPS reverse proxy):
    # ports:
    #   - "127.0.0.1:3000:3000"

volumes:
  app-data:
  app-uploads:
